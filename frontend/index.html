<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Merchant Growth Agent</title>
    <script>
      // Applied synchronously, before first paint, so the correct theme
      // renders immediately instead of flashing light-then-dark.
      // theme.ts (React) takes over from here for toggling/persistence.
      (function () {
        try {
          var stored = window.localStorage.getItem('merchant-agent-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
